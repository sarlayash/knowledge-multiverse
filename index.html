<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07080f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Multiverse" />
    <meta name="application-name" content="Knowledge Multiverse" />
    <meta name="description" content="Knowledge Multiverse: Zero to Expert Level 1 to 25. Powered by Kapil." />
    <link rel="manifest" href="./manifest.json" />
    <title>Knowledge Multiverse | Powered by Kapil</title>
  </head>
  <body class="bg-deep-space text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => {
              console.log('Knowledge Multiverse SW registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('SW registration warning:', err);
            });
        });
      }
    </script>
  </body>
</html>
